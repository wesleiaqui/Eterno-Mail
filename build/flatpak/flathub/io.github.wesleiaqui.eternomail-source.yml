# Legacy local source experiment. It is intentionally not the Flathub manifest:
# it downloads dependencies during build, despite pinning the Wails CLI.
app-id: io.github.wesleiaqui.eternomail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: eterno-mail

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1
  # Secret Service access for the existing go-keyring integration
  - --talk-name=org.freedesktop.secrets

modules:
  - name: aerion
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        GOROOT: /usr/lib/sdk/golang
        GOPATH: /run/build/aerion/go
        GOCACHE: /run/build/aerion/go-cache
        GO111MODULE: 'on'
        CGO_ENABLED: '1'
        # Use direct mode for reliability
        GOPROXY: 'direct'
        GOSUMDB: 'off'
        NODE_ENV: production
        npm_config_cache: /run/build/aerion/npm-cache

    build-commands:
      # Install Wails CLI
      - |
        export PATH=$PATH:/run/build/aerion/go/bin
        export GOPATH=/run/build/aerion/go
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Install frontend dependencies
      - |
        cd frontend
        npm install --legacy-peer-deps
        cd ..

      # Build the application. Official OAuth desktop-client configuration is
      # versioned source code; do not inject credentials through build flags.
      - |
        export PATH=$PATH:/run/build/aerion/go/bin
        /run/build/aerion/go/bin/wails build -tags webkit2_41,linux,production -o eterno-mail

      # Install the binary
      - install -Dm755 build/bin/eterno-mail /app/bin/eterno-mail

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/io.github.wesleiaqui.eternomail.desktop /app/share/applications/io.github.wesleiaqui.eternomail.desktop

      # Update desktop file Icon and Exec fields
      - desktop-file-edit --set-key=Icon --set-value=io.github.wesleiaqui.eternomail /app/share/applications/io.github.wesleiaqui.eternomail.desktop
      - desktop-file-edit --set-key=Exec --set-value=eterno-mail /app/share/applications/io.github.wesleiaqui.eternomail.desktop

      # Install icon with correct app ID
      - install -Dm644 build/appicon.png /app/share/icons/hicolor/256x256/apps/io.github.wesleiaqui.eternomail.png

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/io.github.wesleiaqui.eternomail.metainfo.xml /app/share/metainfo/io.github.wesleiaqui.eternomail.metainfo.xml

    sources:
      # Local source for development builds (make flatpak-dev)
      - type: dir
        path: ../../..
