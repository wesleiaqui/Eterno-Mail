app-id: io.github.wesleiaqui.eternomail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: eterno-mail

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1
  # Secret Service access for the existing go-keyring integration
  - --talk-name=org.freedesktop.secrets

modules:
  - name: aerion
    buildsystem: simple
    build-commands:
      # Install pre-built binary from host
      - install -Dm755 build/bin/eterno-mail /app/bin/eterno-mail

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/io.github.wesleiaqui.eternomail.desktop /app/share/applications/io.github.wesleiaqui.eternomail.desktop
      - desktop-file-edit --set-key=Icon --set-value=io.github.wesleiaqui.eternomail /app/share/applications/io.github.wesleiaqui.eternomail.desktop
      - desktop-file-edit --set-key=Exec --set-value='eterno-mail %U' /app/share/applications/io.github.wesleiaqui.eternomail.desktop

      # Install icon
      - install -Dm644 build/appicon.png /app/share/icons/hicolor/256x256/apps/io.github.wesleiaqui.eternomail.png

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/io.github.wesleiaqui.eternomail.metainfo.xml /app/share/metainfo/io.github.wesleiaqui.eternomail.metainfo.xml

    sources:
      - type: dir
        path: ../..
